quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/lawyer}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:lawyer}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:lawyer}
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://18.230.84.146
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

quarkus.http.auth.permission.authenticated.paths=/pessoas,/pessoas/*,/usuarios,/usuarios/*,/processos,/processos/*,/movimentacoes,/movimentacoes/*,/rt/export
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.public.paths=/auth/login
quarkus.http.auth.permission.public.policy=permit

mp.jwt.verify.issuer=${JWT_ISSUER:law-office-management}
mp.jwt.verify.publickey.location=/app/keys/publicKey.pem
smallrye.jwt.sign.key.location=/app/keys/privateKey.pem
law-office.jwt.issuer=${JWT_ISSUER:law-office-management}
law-office.jwt.expires-in-seconds=${JWT_EXPIRES_IN_SECONDS:3600}
law-office.bootstrap.admin.enabled=false
law-office.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
law-office.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}

quarkus.log.category."com.example.lawyer".level=INFO
quarkus.security.events.enabled=true
rt.escritorio.endereco=Avenida JK, 763, Coqueiral, em Cascavel – PR
aws.s3.bucket=${AWS_S3_BUCKET:velasco-advocacia-anexos-rt}
aws.s3.region=${AWS_S3_REGION:sa-east-1}
aws.s3.presigned-url-expiration-seconds=${AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:900}
aws.s3.max-file-size-bytes=${AWS_S3_MAX_FILE_SIZE_BYTES:52428800}
quarkus.http.limits.max-form-attribute-size=${QUARKUS_HTTP_MAX_FORM_ATTRIBUTE_SIZE:50M}
quarkus.http.limits.max-body-size=${QUARKUS_HTTP_MAX_BODY_SIZE:250M}
